<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; overflow: hidden; touch-action: none; }
  #c { width: 100%; height: 100%; display: block; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #9aa3b5; font: 12px/1.6 -apple-system, "PingFang SC", sans-serif;
    background: rgba(23,27,36,.85); padding: 4px 12px; border-radius: 8px;
    border: 1px solid #2a3140; pointer-events: none; }
  #joy { position: fixed; left: 20px; bottom: 24px; width: 96px; height: 96px;
    border-radius: 50%; background: rgba(31,37,48,.7);
    border: 1px solid #2a3140; display: none; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; border-radius: 50%; background: #ffb85c;
    box-shadow: 0 0 14px rgba(255,184,92,.5); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">…</div>
<div id="joy"><div id="knob"></div></div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="viewer.js"></script>
</body>
</html>
